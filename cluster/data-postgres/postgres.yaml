# Shared Postgres data plane — namespace `data`, one server for all apps
# (snoopy_home / gelp / transigen / future). Single source of truth lives HERE
# in the platform repo; this file was moved verbatim from
# snoopy_home/deploy/k8s/postgres.yaml (ownership handover, docs/runbook.md).
#
# HANDOVER RULE: the spec below must stay byte-identical to what is live in
# prod until the handover is verified with `kubectl diff -f` (expect: no
# changes). NEVER delete/recreate — the PVC holds all app data.
apiVersion: v1
kind: Namespace
metadata:
  name: data
  # Pod Security Admission (audit finding #5, added 2026-07-28) — `baseline`,
  # not `restricted`: the official postgres image starts as root and drops to
  # uid 999 via gosu, so `restricted` is not reachable without also chowning the
  # PVC data dir (that is Phase B-7, and it needs a maintenance window).
  # `warn`/`audit` only, never `enforce` — see cluster/namespaces.yaml.
  #
  # PSA:用 `baseline` 而非 `restricted` —— 官方 postgres image 是先以 root 啟動、
  # 再用 gosu 降到 uid 999,不先 chown PVC 資料目錄就達不到 `restricted`
  # (那是 Phase B-7,需要維護窗口)。同樣只上 warn/audit,不上 enforce。
  #
  # NOTE: this changes the Namespace object only. The Deployment/PVC spec below
  # is untouched, per the HANDOVER RULE above.
  # 註:這裡只動 Namespace 物件,下面的 Deployment/PVC 依上述 HANDOVER RULE 未更動。
  labels:
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
---
# postgres-secret is NOT defined here on purpose — a Secret's value would be a
# plaintext password committed to git. Create it once, before applying this
# file, sourced from a shell variable:
#   POSTGRES_PASSWORD="<superuser-pw>" && \
#   kubectl create secret generic postgres-secret -n data \
#     --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
#     --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:17
          env:
            # POSTGRES_DB only matters on FIRST init of an empty volume (it
            # pre-creates snoopy's DB, a legacy of snoopy owning this file).
            # On the live PVC it is ignored. Kept identical for no-op apply;
            # disaster recovery re-creates the other DBs via provision-db.sh.
            - { name: POSTGRES_DB, value: snoopy_home }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
spec:
  selector: { app: postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
