# All namespaces on the shared node, created by platform (apps assume theirs
# exists). `data` is created in data-postgres/postgres.yaml alongside the
# server it hosts. my_website (lans-h-site) lives in `web`; it was moved out of
# `default` on 2026-07-26 (its manifests originally predated namespacing).
apiVersion: v1
kind: Namespace
metadata:
  name: platform        # platform-owned cluster plumbing: wildcard cert, TLSStore, www redirect
---
apiVersion: v1
kind: Namespace
metadata:
  name: snoopy
---
apiVersion: v1
kind: Namespace
metadata:
  name: gelp
---
apiVersion: v1
kind: Namespace
metadata:
  name: transigen
---
apiVersion: v1
kind: Namespace
metadata:
  name: web           # my_website / lans-h-site (apex lans-h.cc + www 301)
