# All namespaces on the shared node, created by platform (apps assume theirs
# exists). `data` is created in data-postgres/postgres.yaml alongside the
# server it hosts. my_website currently deploys to `default` (its manifests
# predate namespacing) — moving it to a `web` namespace is a pending cleanup,
# tracked in docs/runbook.md.
apiVersion: v1
kind: Namespace
metadata:
  name: platform        # platform-owned cluster plumbing: wildcard cert, TLSStore, www redirect
---
apiVersion: v1
kind: Namespace
metadata:
  name: snoopy
---
apiVersion: v1
kind: Namespace
metadata:
  name: gelp
---
apiVersion: v1
kind: Namespace
metadata:
  name: transigen
